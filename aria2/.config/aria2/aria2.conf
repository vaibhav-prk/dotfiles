# Download settings
continue=true
dir=${HOME}/Downloads
max-concurrent-downloads=5
split=8
max-connection-per-server=8
min-split-size=10M

# RPC settings
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-secret=HOLA

# BitTorrent settings
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true
seed-time=0
